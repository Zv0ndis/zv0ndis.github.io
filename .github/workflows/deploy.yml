name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up changes in the data repo. A push-triggered dispatch would need a
  # token for this repo stored next to the data, so polling is the safer option.
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Exams and deadlines live in a private data repo. The build reads it with a
      # read-only deploy key; whatever writes there has no access to this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Zv0ndis/zvondis-data
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: .data
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Only a file with exactly the expected shape is published; otherwise the
      # build fails and the last good deploy stays up.
      - name: Validate and publish skola.json
        run: |
          node scripts/validate-skola.mjs --selftest
          node scripts/validate-skola.mjs .data/skola.json _site/skola.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
