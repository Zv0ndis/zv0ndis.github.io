name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prettier formatting check
        run: npm run format:check

      - name: CSS lint
        run: npm run lint:css

      - name: Build site
        run: npm run build

      - name: HTML validation
        run: npm run lint:html

      # Crawls every page in sitemap.xml (navigation is client-rendered, so a
      # crawler cannot discover the pages by following links from the homepage).
      # Absolute self-URLs (canonical/hreflang/og:url) are rewritten to the local
      # server so the check tests this build instead of the deployed site.
      # myaccount.google.com is skipped: it is auth-gated and returns 401 to
      # unauthenticated clients, so it can never pass.
      - name: Link check
        run: |
          npx serve _site -l 3000 --no-clipboard &
          for i in $(seq 60); do
            curl -sf http://localhost:3000/index.html >/dev/null && break
            if [ "$i" -eq 60 ]; then
              echo "::error::local server did not come up within 60s"
              exit 1
            fi
            sleep 1
          done
          npx linkinator http://localhost:3000/index.html \
            --recurse --sitemap --silent --retry --retry-errors \
            --url-rewrite-search "https://zv0ndis.github.io" \
            --url-rewrite-replace "http://localhost:3000" \
            --skip "myaccount.google.com"

  # Separate job so a noisy performance number never holds up the other checks.
  # This does not gate deploys either — deploy.yml is its own workflow.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
