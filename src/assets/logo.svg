<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="diagFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9d3e0"/>
      <stop offset="100%" stop-color="#a9b6c9"/>
    </linearGradient>
    <linearGradient id="botFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="url(#bg)"/>

  <!-- white square frame with two opposite corners chamfered, like the original -->
  <polygon points="10,10 74,10 90,26 90,90 26,90 10,74"
           fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- top bar -->
  <polygon points="22,22 78,22 78,38 22,38" fill="url(#topFacet)"/>
  <!-- diagonal facet (shadowed) -->
  <polygon points="78,38 38,62 22,62 62,38" fill="url(#diagFacet)"/>
  <!-- bottom bar -->
  <polygon points="22,62 78,62 78,78 22,78" fill="url(#botFacet)"/>
</svg>
